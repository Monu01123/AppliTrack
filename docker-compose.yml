version: "3.8"
# Triggers CI/CD

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hireiq-backend
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://127.0.0.1:6379
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hireiq-redis
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  redis_data:
